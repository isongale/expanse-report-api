# Development services. One process per container; every service is added explicitly.
name: expanse-report

services:
  # PHP-FPM running the Laravel application. Speaks FastCGI on port 9000,
  # reachable only from the internal network (no published port).
  app:
    build:
      context: ./docker/php
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    # Explicit name: the "queue" service runs this same image.
    image: expanse-report-app
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Queue worker: same image and code as "app", different process.
  # It keeps the code in memory: run "docker compose restart queue" after changing a job.
  queue:
    build:
      context: ./docker/php
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    image: expanse-report-app
    # List form, so PHP is PID 1 and receives the stop signal directly.
    # --timeout must stay below retry_after (90s, config/queue.php);
    # --max-time makes the worker exit hourly and "restart" brings it back with fresh memory.
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=60", "--max-time=3600"]
    # The image inherits SIGQUIT from php-fpm; the worker's documented graceful signal is SIGTERM.
    stop_signal: SIGTERM
    # Longer than --timeout: a running job can finish before Docker sends SIGKILL.
    stop_grace_period: 70s
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
    restart: unless-stopped

  # nginx: terminates HTTP, serves static files from public/ and forwards
  # PHP requests to the "app" service.
  web:
    image: nginx:1.30-alpine
    ports:
      # Bound to localhost only: the dev API is not exposed on the LAN.
      - "127.0.0.1:8080:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  # MySQL: relational data. Credentials come from .env and are applied only
  # when the volume is first initialised (recreate it with "down -v" to change them).
  mysql:
    image: mysql:9.7
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:?set DB_DATABASE in .env (see .env.example)}"
      MYSQL_USER: "${DB_USERNAME:?set DB_USERNAME in .env (see .env.example)}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD in .env (see .env.example)}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env (see .env.example)}"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      start_interval: 2s
      retries: 5
      start_period: 30s
      timeout: 10s
    restart: unless-stopped

  # Redis: queues and sessions (database 0), cache (database 1).
  # No published port: use "docker compose exec redis redis-cli".
  redis:
    image: redis:8.10
    # --appendonly: every write is logged to disk, so queued jobs survive a restart.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env (see .env.example)}", "--appendonly", "yes"]
    environment:
      # Read by redis-cli: the healthcheck authenticates without the password in its command line.
      REDISCLI_AUTH: "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env (see .env.example)}"
    volumes:
      - redis-data:/data
    healthcheck:
      # redis-cli exits 0 even on an auth error, so check the reply itself.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      start_interval: 2s
      retries: 5
      start_period: 10s
      timeout: 5s
    restart: unless-stopped

  # Mailpit: catches every email sent by the app. Web UI on http://localhost:8025;
  # SMTP (mailpit:1025) is reachable only from the internal network.
  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
