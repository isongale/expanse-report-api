# Development services. One process per container; every service is added explicitly.
name: expanse-report

services:
  # PHP-FPM running the Laravel application. Speaks FastCGI on port 9000,
  # reachable only from the internal network (no published port).
  app:
    build:
      context: ./docker/php
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
        restart: true
    restart: unless-stopped

  # nginx: terminates HTTP, serves static files from public/ and forwards
  # PHP requests to the "app" service.
  web:
    image: nginx:1.30-alpine
    ports:
      # Bound to localhost only: the dev API is not exposed on the LAN.
      - "127.0.0.1:8080:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  # MySQL: relational data. Credentials come from .env and are applied only
  # when the volume is first initialised (recreate it with "down -v" to change them).
  mysql:
    image: mysql:9.7
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:?set DB_DATABASE in .env (see .env.example)}"
      MYSQL_USER: "${DB_USERNAME:?set DB_USERNAME in .env (see .env.example)}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD in .env (see .env.example)}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env (see .env.example)}"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      start_interval: 2s
      retries: 5
      start_period: 30s
      timeout: 10s
    restart: unless-stopped

volumes:
  mysql-data:
