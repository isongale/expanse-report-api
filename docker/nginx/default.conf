server {
    listen 80;
    server_name _;

    # Only the public/ directory is exposed: application code stays out of the web root.
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    server_tokens off;

    # Serve the file if it exists, otherwise hand the request to the front controller.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Only index.php is executed: any other .php file is not passed to PHP-FPM.
    location = /index.php {
        fastcgi_pass app:9000;
        include fastcgi_params;
        # Path as seen by the PHP-FPM container, not by nginx.
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php$ {
        return 404;
    }

    # Deny dotfiles (e.g. .env, .git), except the ACME challenge directory.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
